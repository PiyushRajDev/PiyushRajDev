<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="SkillLighthouse: Verified skills, not resumes." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.6"><stop offset="0" stop-color="#22c55e" stop-opacity="0.22"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#166534"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#166534"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1e293b" stroke-width="1" opacity=".5"/></pattern>
    <filter id="g" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="480" height="270" rx="16"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
    .sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .trace{animation:trace 6s linear infinite}
    @keyframes trace{to{stroke-dashoffset:-1000}}
    .grow{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite}
    @keyframes grow{0%{transform:scaleY(.12)}45%,85%{transform:scaleY(1)}100%{transform:scaleY(.12)}}
    .draw{animation:draw 4s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:100}60%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
    .peak{animation:peak 4s ease-in-out infinite}
    @keyframes peak{0%,55%{opacity:0}65%,92%{opacity:1}100%{opacity:0}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
    @keyframes ping{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
  </style>
  <g clip-path="url(#c)">
    <rect width="480" height="270" fill="url(#bg)"/><rect width="480" height="270" fill="url(#grid)"/><rect width="480" height="270" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="478" height="268" rx="15" fill="none" stroke="#14532d" stroke-width="2"/>
  <rect class="trace" x="1" y="1" width="478" height="268" rx="15" fill="none" stroke="#4ade80" stroke-width="2" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round"/>
  <text class="mono" x="28" y="42" font-size="11" fill="#22c55e" letter-spacing="3">02 / PROJECT</text>
  <text class="sans" x="28" y="94" font-size="36" font-weight="800" fill="url(#ttl)">SkillLighthouse</text>
  <text class="sans" x="28" y="124" font-size="15" fill="#94a3b8">Verified skills, not resumes.</text>
  <line x1="330" y1="150" x2="446" y2="150" stroke="#14532d" stroke-width="1"/>
  <rect class="grow" style="animation-delay:0.00s" x="338" y="116" width="12" height="34" rx="3" fill="url(#bar)"/><rect class="grow" style="animation-delay:0.18s" x="358" y="98" width="12" height="52" rx="3" fill="url(#bar)"/><rect class="grow" style="animation-delay:0.36s" x="378" y="106" width="12" height="44" rx="3" fill="url(#bar)"/><rect class="grow" style="animation-delay:0.54s" x="398" y="80" width="12" height="70" rx="3" fill="url(#bar)"/><rect class="grow" style="animation-delay:0.72s" x="418" y="58" width="12" height="92" rx="3" fill="url(#bar)"/>
  <g transform="translate(424 40)"><circle class="ping" r="11" fill="#22c55e"/><circle r="11" fill="#22c55e"/><path d="M-5 0.5l3.5 3.5l6.5-7.5" fill="none" stroke="#052e16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g><rect x="28" y="172" width="87" height="24" rx="12" fill="#052e16" stroke="#166534"/><text class="mono" x="72" y="188" text-anchor="middle" font-size="11" fill="#86efac">TypeScript</text></g>
  <g><rect x="123" y="172" width="87" height="24" rx="12" fill="#052e16" stroke="#166534"/><text class="mono" x="166" y="188" text-anchor="middle" font-size="11" fill="#86efac">PostgreSQL</text></g>
  <g><rect x="218" y="172" width="54" height="24" rx="12" fill="#052e16" stroke="#166534"/><text class="mono" x="245" y="188" text-anchor="middle" font-size="11" fill="#86efac">Redis</text></g>
  <g><rect x="280" y="172" width="120" height="24" rx="12" fill="#052e16" stroke="#166534"/><text class="mono" x="340" y="188" text-anchor="middle" font-size="11" fill="#86efac">Background jobs</text></g>
  <g><rect x="28" y="204" width="107" height="24" rx="12" fill="#052e16" stroke="#166534"/><text class="mono" x="82" y="220" text-anchor="middle" font-size="11" fill="#86efac">AI interviews</text></g>
  <text class="mono" x="28" y="256" font-size="11" fill="#475569">github.com/PiyushRajDev/slh_demo</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
