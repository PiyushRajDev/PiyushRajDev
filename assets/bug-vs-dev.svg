    <text x="820" y="205" font-size="29" fill="#f1ede4" opacity="0" letter-spacing="5">CLASH<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.22;.24;.29;1" dur="28s" repeatCount="indefinite"/></text>
    <text x="852" y="152" font-size="29" fill="#bd4438" opacity="0" letter-spacing="4">BANKAI</text>
