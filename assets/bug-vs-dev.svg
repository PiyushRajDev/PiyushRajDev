  <text x="1160" y="35" text-anchor="end">FIELD TEST 001 — 28 SEC LOOP</text>
</g>
<path d="M40 48H1160" stroke="#f1ede4" stroke-opacity=".72" stroke-width="1.5"/>

<!-- Profile identity -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="48" y="116" fill="#f1ede4" font-size="43" font-weight="700" letter-spacing="-2">PIYUSH RAJ</text>
  <rect x="49" y="132" width="7" height="7" fill="#bd4438"/>
  <text x="67" y="141" fill="#bd4438" font-size="13" font-weight="700" letter-spacing="2">BACKEND / REAL-TIME / SYSTEMS</text>
  <text x="49" y="187" fill="#f1ede4" font-size="17">Building systems where latency,</text>
  <text x="49" y="214" fill="#f1ede4" font-size="17">state, concurrency and failure</text>
  <text x="49" y="241" fill="#f1ede4" font-size="17">are part of the design.</text>
  <path d="M49 264H405" stroke="#f1ede4" stroke-opacity=".28"/>
  <g fill="#aaa49a" font-size="11" letter-spacing="1.4">
    <text x="49" y="289">VOICE AI</text><text x="151" y="289">DISTRIBUTED SYSTEMS</text><text x="326" y="289">OPEN SOURCE</text>
  </g>
  <text x="49" y="365" fill="#77736e" font-size="10" letter-spacing="1.5">DESIGN FOR FAILURE. MEASURE THE REST.</text>
</g>

