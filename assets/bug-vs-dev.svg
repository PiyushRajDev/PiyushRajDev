<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Piyush Raj — Systems versus BUG_4041</title>
<desc id="desc">A looping animated duel: a developer breaks into the scene, dashes toward a glitch bug, clashes blades, dodges behind it, lands a sequence of slashes and a finishing move, then the scene rebuilds. Backend, real-time and distributed systems engineering.</desc>
<metadata>{&quot;duration_seconds&quot;:28,&quot;loop&quot;:true,&quot;acts&quot;:[&quot;entry&quot;,&quot;first-clash&quot;,&quot;teleport-dodge&quot;,&quot;multi-slash&quot;,&quot;finisher&quot;,&quot;reset&quot;]}</metadata>
<defs>
  <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#b83d31"/><stop offset=".55" stop-color="#f1ede4"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <radialGradient id="aura"><stop offset="0" stop-color="#d44b3e" stop-opacity=".5"/><stop offset="1" stop-color="#d44b3e" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#f1ede4" stroke-opacity=".045" stroke-width="1"/></pattern>
  <clipPath id="arena"><rect x="470" y="65" width="690" height="330" rx="2"/></clipPath>
</defs>

<rect width="1200" height="440" fill="#0e0e0e"/>
<rect width="1200" height="440" fill="url(#scan)"/>
<rect x="8" y="8" width="1184" height="424" fill="none" stroke="#f1ede4" stroke-width="2"/>
<rect x="8" y="8" width="1184" height="424" fill="url(#grid)"/>
<g fill="#f1ede4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2">
