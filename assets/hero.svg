    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.28"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/><stop offset="0.5" stop-color="#22c55e" stop-opacity="0.35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace}
    .sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .b{transform-box:fill-box;transform-origin:center;animation:wave 1.4s ease-in-out infinite}
    @keyframes wave{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
    .rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
    .d1{animation-delay:.15s} .d2{animation-delay:.35s} .d3{animation-delay:.55s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .dot{animation:ping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ping{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
  </style>
