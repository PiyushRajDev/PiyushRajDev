<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Vāk pipeline: speaker to speech-to-text to translation to text-to-speech to listener" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/></pattern>
    <filter id="g" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1000" height="250" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
    .sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .node{animation:nodeglow 4s ease-in-out infinite}
    @keyframes nodeglow{0%,100%{stroke:#166534;stroke-width:1.5}15%{stroke:#4ade80;stroke-width:2.5}35%{stroke:#166534;stroke-width:1.5}}
    .flow{animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-16}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1000" height="250" fill="url(#bg)"/><rect width="1000" height="250" fill="url(#grid)"/>
  </g>
  <rect x="1" y="1" width="998" height="248" rx="17" fill="none" stroke="#14532d" stroke-width="2"/>
  <text class="mono" x="500" y="52" text-anchor="middle" font-size="14" fill="#22c55e" letter-spacing="4">VĀK · LIVE TRANSLATION PIPELINE</text>
  <line class="flow" x1="170.0" y1="148.0" x2="830.0" y2="148.0" stroke="#166534" stroke-width="2" stroke-dasharray="4 4"/>
  <circle r="5" fill="#4ade80" filter="url(#g)"><animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M170.0,148.0 H830.0"/></circle>
    <circle r="5" fill="#4ade80" filter="url(#g)"><animateMotion dur="4s" begin="1s" repeatCount="indefinite" path="M170.0,148.0 H830.0"/></circle>
    <circle r="5" fill="#4ade80" filter="url(#g)"><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M170.0,148.0 H830.0"/></circle>
    <circle r="5" fill="#4ade80" filter="url(#g)"><animateMotion dur="4s" begin="3s" repeatCount="indefinite" path="M170.0,148.0 H830.0"/></circle>
  <g>
      <rect class="node" style="animation-delay:0.0s" x="30.0" y="112" width="140" height="72" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
      <text class="sans" x="100" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">SPEAKER</text>
      <text class="mono" x="100" y="166" text-anchor="middle" font-size="11" fill="#94a3b8">own language</text>
    </g>
    <g>
      <rect class="node" style="animation-delay:0.8s" x="230.0" y="112" width="140" height="72" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
      <text class="sans" x="300" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">STT</text>
      <text class="mono" x="300" y="166" text-anchor="middle" font-size="11" fill="#94a3b8">speech → text</text>
    </g>
    <g>
      <rect class="node" style="animation-delay:1.6s" x="430.0" y="112" width="140" height="72" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
      <text class="sans" x="500" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">TRANSLATE</text>
      <text class="mono" x="500" y="166" text-anchor="middle" font-size="11" fill="#94a3b8">text → text</text>
    </g>
    <g>
      <rect class="node" style="animation-delay:2.4s" x="630.0" y="112" width="140" height="72" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
      <text class="sans" x="700" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">TTS</text>
      <text class="mono" x="700" y="166" text-anchor="middle" font-size="11" fill="#94a3b8">voice preserved</text>
    </g>
    <g>
      <rect class="node" style="animation-delay:3.2s" x="830.0" y="112" width="140" height="72" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
      <text class="sans" x="900" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">LISTENER</text>
      <text class="mono" x="900" y="166" text-anchor="middle" font-size="11" fill="#94a3b8">their language</text>
    </g>
  <text class="mono" x="500" y="222" text-anchor="middle" font-size="12" fill="#64748b" letter-spacing="2">audio in → translated speech out, in real time</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
